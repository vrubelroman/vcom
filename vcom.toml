[startup]
# left_path = "~/Downloads"
# right_path = "~/Projects"

[ui]
app_title = "vcom"
theme = "catppuccin-mocha"
show_title_bar = true
show_footer = true
border = "rounded"
path_display = "smart"
pane_gap = 1
center_width_percent = 30

[browser]
show_hidden = true
dirs_first = true
human_readable_size = true

[browser.sort]
by = "name"
reverse = false

# by = "modified"
# by = "size"
# reverse = true

[browser.columns]
name = true
size = true
modified = true

# created = true
# permissions = true
# extension = true

[preview]
show_metadata = true
wrap_text = false
max_preview_bytes = 65536
directory_preview_limit = 80

# wrap_text = true
# max_preview_bytes = 131072

[behavior]
confirm_delete = true
confirm_overwrite = true
calculate_dir_size_on_space = true
follow_symlinks = false
